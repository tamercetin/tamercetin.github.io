<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tamer Cetin – Home</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #333;
      line-height: 1.6;
    }
    header {
      /* Align header content to the left so the portrait anchors the section */
      background: #f5f5f5;
      text-align: left;
      padding: 50px 20px;
      position: relative;
    }
    header img {
      /* Make the profile picture larger, square, and floated to the left */
      width: 200px;
      height: 200px;
      border-radius: 0;
      object-fit: cover;
      border: 4px solid #ddd;
      float: left;
      margin-right: 20px;
      margin-bottom: 20px;
    }
    header h1 {
      margin-top: 20px;
      font-size: 32px;
    }
    header p {
      margin-top: 10px;
      font-size: 18px;
    }
    nav {
      margin-top: 30px;
    }
    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #0066cc;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    section {
      padding: 40px 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    section h2 {
      color: #0066cc;
      margin-bottom: 15px;
    }
    footer {
      background: #f5f5f5;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
    .social-links a {
      margin: 0 10px;
      color: #0066cc;
      text-decoration: none;
    }
    .social-links a:hover {
      text-decoration: underline;
    }

    /* styles for header social icons */
    .header-social {
      position: absolute;
      top: 20px;
      right: 20px;
      /* align icons in a row with consistent spacing */
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-social img {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>
  <header>
    <img src="profile.jpg" alt="Tamer Cetin" />
    <h1>Tamer Cetin</h1>

    <div class="header-social">

      <a href="https://www.linkedin.com/in/tamer-cetin-a230a338/" target="_blank"><img src="linkedin_icon.png" alt="LinkedIn" /></a>
      <a href="https://scholar.google.com/citations?user=DHZPmFcAAAAJ&hl=en" target="_blank"><img src="scholar_icon.png" alt="Google Scholar" /></a>

      Stanford University<br />

    </p>
